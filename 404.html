<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting | N.Movies</title>
</head>
<body>
  <script>
    const appBasePath = '/nmovies/';
    const route = `${location.pathname}${location.search}${location.hash}`;
    location.replace(`${appBasePath}?route=${encodeURIComponent(route)}`);
  </script>
</body>
</html>
